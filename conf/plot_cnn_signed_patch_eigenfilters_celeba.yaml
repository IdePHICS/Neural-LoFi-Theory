output_dir: results/plot_cnn_signed_patch_eigenfilters

seed: 0
device: mps
root: ./data
remap_labels: true

split: train
batch_size: 256
num_workers: 0

# This script computes signed patch covariance per input channel.
kernel_size: 5
padding: 2
stride: 1
channels_to_use: 3
n_top: 9
cmap: RdBu_r

dataset:
  name: celeba
  preset: male_female
  n_train: 162770
  n_test: 19962
